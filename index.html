<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Para ti 🌼</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="scene">

        <div class="light"></div>

        <div class="particles"></div>

        <div class="bouquet-container">
            <img
                src="assets/images/ramo.jpg"
                alt="Ramo de flores amarillas"
                class="bouquet"
            >
        </div>

        <section class="message">
            <p class="small-text">Para ti...</p>

            <h1>
                Un pequeño pedacito<br>
                de mi corazón 🌼
            </h1>

            <p class="subtitle">
                Porque hay flores que simplemente<br>
                tienen que llegar a la persona correcta.
            </p>

            <button id="startButton">
                Abrir mi regalo
            </button>
        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
