<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Un ramo de flores amarillas para una persona especial."
    >

    <title>Para ti 🌼</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <main class="gift-page">

        <!-- BRILLO -->

        <div class="gift-glow"></div>


        <!-- CONTENIDO -->

        <section class="gift-content">

            <p class="gift-small">
                ESTE RAMO ES PARA TI
            </p>


            <h1>
                Porque tú<br>
                mereces flores amarillas 🌼
            </h1>


            <div class="gift-line"></div>


            <p class="gift-message">
                No necesitaba una fecha especial
                para darte un pequeño detalle.
                Solo quería recordarte lo especial
                que eres para mí.
            </p>


            <!-- RAMO -->

            <div class="gift-bouquet">

                <img
                    src="assets/images/ramo.jpg"
                    alt="Ramo de flores amarillas"
                >

            </div>


            <!-- REGRESAR -->

            <a
                href="index.html"
                class="back-button"
            >
                ← VOLVER
            </a>

        </section>

    </main>

</body>

</html>
